{% extends "base.html" %}
{% block title %}— Login{% endblock %}

{% block content %}
<div style="max-width:420px; margin:3rem auto;">

    <div style="text-align:center; margin-bottom:2rem;">
        <h1 style="font-size:2.2rem; color: #7c6aff; margin-bottom:0.5rem;">Welcome</h1>
        <p style="color:var(--muted);">Sign in to continue swapping skills</p>
    </div>

    <div class="card">
        <form method="POST">
            <label>Email</label>
            <input type="email" name="email" required placeholder="you@example.com" autofocus>

            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.75rem;">
                Sign In →
            </button>
        </form>

        <p style="text-align:center; margin-top:1.25rem; color:var(--muted); font-size:0.9rem;">
            No account yet?
            <a href="{{ url_for('auth.register') }}" style="color:var(--accent); font-weight:600;">
                Create one
            </a>
        </p>
    </div>
</div>
{% endblock %}
