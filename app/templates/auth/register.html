{% extends "base.html" %}
{% block title %}— Register{% endblock %}

{% block content %}
<div style="max-width:420px; margin:3rem auto;">

    <div style="text-align:center; margin-bottom:2rem;">
        <h1 style="font-size:2.2rem; color: #7c6aff; margin-bottom:0.5rem;">Join SkillSwap</h1>
        <p style="color:var(--muted);">Trade skills. Grow together. Free forever.</p>
    </div>

    <div class="card">
        <form method="POST">
            <label>Full Name</label>
            <input type="text" name="name" required placeholder="e.g. Balen Shah" autofocus>

            <label>Email</label>
            <input type="email" name="email" required placeholder="you@example.com">

            <label>Location</label>
            <input type="text" name="location" required placeholder="e.g. Kathmandu, Nepal">

            <label>Password</label>
            <input type="password" name="password" required placeholder="Min 6 characters">

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required placeholder="••••••••">

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.75rem;">
                Create Account →
            </button>
        </form>

        <p style="text-align:center; margin-top:1.25rem; color:var(--muted); font-size:0.9rem;">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" style="color:var(--accent); font-weight:600;">
                Sign in
            </a>
        </p>
    </div>
</div>
{% endblock %}
