{% extends "base.html" %}
{% block title %}— Rate {{ rated_user.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width:520px; margin:auto;">
    <h2 style="margin-bottom:0.5rem;">Rate Your Exchange</h2>
    <p style="color:var(--muted); margin-bottom:1.5rem;">
        with <b style="color:var(--text);">{{ rated_user.name }}</b>
    </p>

    <form method="POST" id="rating-form">

        <label>Your Rating</label>

        <!-- Star Rating UI -->
        <div id="star-container" style="display:flex; gap:0.5rem;
             margin-bottom:1.5rem; flex-direction:row-reverse;
             justify-content:flex-end;">
            {% for i in range(5, 0, -1) %}
            <span class="star" data-value="{{ i }}"
                  style="font-size:2rem; cursor:pointer;
                         color:#2e3248; transition:color 0.15s;">
                ★
            </span>
            {% endfor %}
        </div>

        <input type="hidden" name="rating" id="rating-input" value="" required>
        <p id="rating-error" style="color:var(--accent2); font-size:0.85rem;
           margin-top:-1rem; margin-bottom:1rem; display:none;">
            Please select a star rating.
        </p>

        <label>Feedback
            <span style="color:var(--muted); font-weight:normal;">
                (optional)
            </span>
        </label>
        <textarea name="feedback" rows="4"
            placeholder="Share your experience with this exchange..."
            style="resize:vertical;"></textarea>

        <div style="display:flex; gap:1rem; margin-top:0.5rem;">
            <button type="submit" class="btn btn-primary">
                Submit Rating
            </button>
            <a href="{{ url_for('requests_bp.exchanges') }}"
               style="color:var(--muted); padding:0.6rem 0;">
               Skip
            </a>
        </div>
    </form>
</div>

<style>
    /* Star hover effect using CSS — row-reverse trick */
    .star { user-select: none; }
    .star.active { color: #ffaa3d !important; }
    .star.hovered { color: #ffaa3d !important; }
</style>

<script>
    const stars      = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('rating-input');
    const ratingError = document.getElementById('rating-error');
    let selectedRating = 0;

    stars.forEach(star => {
        // Hover effect
        star.addEventListener('mouseenter', () => {
            const val = parseInt(star.dataset.value);
            stars.forEach(s => {
                s.style.color = parseInt(s.dataset.value) <= val
                    ? '#ffaa3d' : '#2e3248';
            });
        });

        // Reset hover when leaving container
        star.addEventListener('mouseleave', () => {
            stars.forEach(s => {
                s.style.color = parseInt(s.dataset.value) <= selectedRating
                    ? '#ffaa3d' : '#2e3248';
            });
        });

        // Click to select
        star.addEventListener('click', () => {
            selectedRating = parseInt(star.dataset.value);
            ratingInput.value = selectedRating;
            ratingError.style.display = 'none';
            stars.forEach(s => {
                s.style.color = parseInt(s.dataset.value) <= selectedRating
                    ? '#ffaa3d' : '#2e3248';
            });
        });
    });

    // Validate before submit
    document.getElementById('rating-form').addEventListener('submit', e => {
        if (!ratingInput.value) {
            e.preventDefault();
            ratingError.style.display = 'block';
        }
    });
</script>
{% endblock %}
