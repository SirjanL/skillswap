{% extends "base.html" %}
{% block title %}— Edit Skill{% endblock %}

{% block content %}
<div class="card" style="max-width:520px; margin:auto;">

    <div style="display:flex; justify-content:space-between;
                align-items:center; margin-bottom:1.5rem;">
        <h2>✏️ Edit Skill</h2>
        <a href="{{ url_for('profile.manage_skills') }}"
           style="color:var(--muted); font-size:0.9rem;">
            ← Back
        </a>
    </div>

    <form method="POST">

        <label>Skill Name</label>
        <input type="text" name="skill_name"
               value="{{ user_skill.skill.skill_name }}"
               placeholder="e.g. Python, Guitar, Cooking"
               required>

        <label>Category</label>
        <select name="category" required>
            <option value="">— Select a category —</option>
            {% for cat in categories %}
            <option value="{{ cat }}"
                {% if cat == user_skill.skill.category %}selected{% endif %}>
                {{ cat }}
            </option>
            {% endfor %}
        </select>

        <label>Type</label>
        <select name="skill_type">
            <option value="offer"
                {% if user_skill.type == 'offer' %}selected{% endif %}>
                I can Offer this skill
            </option>
            <option value="want"
                {% if user_skill.type == 'want' %}selected{% endif %}>
                I want to Learn this skill
            </option>
        </select>

        <label>Level</label>
        <select name="level">
            <option value="beginner"
                {% if user_skill.level == 'beginner' %}selected{% endif %}>
                Beginner
            </option>
            <option value="intermediate"
                {% if user_skill.level == 'intermediate' %}selected{% endif %}>
                Intermediate
            </option>
            <option value="advanced"
                {% if user_skill.level == 'advanced' %}selected{% endif %}>
                Advanced
            </option>
        </select>

        <div style="display:flex; gap:1rem; margin-top:0.5rem;">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
            <a href="{{ url_for('profile.manage_skills') }}"
               style="color:var(--muted); padding:0.6rem 0;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
