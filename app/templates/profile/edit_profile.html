{% extends "base.html" %}
{% block title %}— Edit Profile{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px; margin: auto;">
    <h2 style="margin-bottom:1.5rem;">Edit Profile</h2>

    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" value="{{ user.name }}" required>

        <label>Location</label>
        <input type="text" name="location" value="{{ user.location }}" placeholder="e.g. Kathmandu, Nepal" required>

        <label>Bio</label>
        <textarea name="bio" rows="4" placeholder="Tell others a bit about yourself...">{{ user.bio }}</textarea>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('profile.view_profile') }}" style="margin-left:1rem; color:#777;">Cancel</a>
    </form>

    <hr style="margin:2rem 0; border-color:rgba(255,77,109,0.2);">

    <h3 style="color:#ff4d6d; font-family:'Serif',sans-serif;
            font-size:1rem; margin-bottom:0.5rem;">
        ⚠️ Danger Zone
    </h3>
    <p style="color:var(--muted); font-size:0.85rem; margin-bottom:1rem;">
        Permanently delete your account and all your data.
        This action cannot be undone.
    </p>

    <form method="POST" action="{{ url_for('profile.delete_account') }}"
        onsubmit="return confirm('Are you absolutely sure? This will permanently delete your account and cannot be undone.')">
        <button type="submit" class="btn btn-danger">
            🗑️ Delete My Account
        </button>
    </form>    
</div>
{% endblock %}
