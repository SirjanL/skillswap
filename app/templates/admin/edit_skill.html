{% extends "admin/base_admin.html" %}
{% block title %}— Edit Skill{% endblock %}
{% block topbar_title %}Edit Skill{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Skill</h1>
    <p>Update skill name and category.</p>
</div>

<div class="card" style="max-width:480px;">
    <form method="POST">

        <label>Skill Name</label>
        <input type="text" name="skill_name"
               value="{{ skill.skill_name }}" required>

        <label>Category</label>
        <select name="category" required>
            <option value="">— Select a category —</option>
            {% for cat in [
                'Tech & Development',
                'Data & AI',
                'Design & Visual Arts',
                'Music & Audio',
                'Writing & Languages',
                'Academics & Sciences',
                'Lifestyle & Wellness',
                'Business & Professional'
            ] %}
            <option value="{{ cat }}"
                {% if cat == skill.category %}selected{% endif %}>
                {{ cat }}
            </option>
            {% endfor %}
        </select>

        <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
            <a href="{{ url_for('admin.skills') }}"
               class="btn btn-danger">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
